apiVersion: v1
kind: Service
metadata:
  name: httpd-service
spec:
  type: NodePort # Exposes the service on a static port on each Node's IP
  selector:
    app: httpd-app # Selects pods with the label 'app: httpd-app'
  ports:
  - protocol: TCP
    port: 80 # The port the service itself exposes
    targetPort: 80 # The port on the pods to forward traffic to
    nodePort: 30004 # Optional: A specific port to access externally (range 30000-32767)
